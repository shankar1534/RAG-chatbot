<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sana AI Assistant</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #8b5cf6;
        --accent-2: #38bdf8;
        --danger: #ef4444;
        --success: #22c55e;
      }

      * { box-sizing: border-box; }
      html, body {
        height: 100%; margin: 0;
        overflow: hidden;
      }
      body {
        font-family: Inter, Arial, sans-serif;
        background: linear-gradient(135deg, var(--bg), #111827);
        color: var(--text);
      }

      /* ── Layout ───────────────────────────────────── */
      .app {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 16px;
        gap: 12px;
        overflow: hidden;
      }

      .card {
        background: rgba(17,24,39,0.92);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      }

      /* ── Header ───────────────────────────────────── */
      .header {
        padding: 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      .header h1 { margin: 0; font-size: 1.3rem; }
      .header p  { margin: 2px 0 0; color: var(--muted); font-size: 0.88rem; }

      /* ── Main area ────────────────────────────────── */
      .main {
        display: grid;
        grid-template-columns: 270px 1fr;
        gap: 16px;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      /* ── Sidebar ──────────────────────────────────── */
      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 0;
        overflow: hidden;
      }
      .sidebar-card {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        padding: 14px;
        gap: 10px;
      }
      .sidebar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
      }
      .sidebar-header h2 { margin: 0; font-size: 0.95rem; font-weight: 700; }

      .thread-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        overflow-y: auto;
        flex: 1;
        min-height: 0;
        padding-right: 2px;
      }
      .thread-list::-webkit-scrollbar { width: 4px; }
      .thread-list::-webkit-scrollbar-track { background: transparent; }
      .thread-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }

      .thread-item {
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.07);
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
        transition: background 0.15s;
      }
      .thread-item:hover { background: rgba(255,255,255,0.09); }
      .thread-item.active {
        background: rgba(139,92,246,0.18);
        border-color: rgba(139,92,246,0.45);
      }
      .thread-item .thread-body { flex: 1; min-width: 0; }
      .thread-item .thread-title {
        font-weight: 600;
        font-size: 0.85rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .thread-item .thread-meta {
        font-size: 0.72rem;
        color: var(--muted);
        margin-top: 3px;
      }
      .thread-item .thread-preview {
        font-size: 0.75rem;
        color: var(--muted);
        margin-top: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .thread-delete {
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        padding: 2px 4px;
        border-radius: 6px;
        font-size: 0.85rem;
        flex-shrink: 0;
        line-height: 1;
        opacity: 0;
        transition: opacity 0.15s, color 0.15s;
      }
      .thread-item:hover .thread-delete { opacity: 1; }
      .thread-delete:hover { color: var(--danger); }

      .sidebar-empty {
        color: var(--muted);
        font-size: 0.82rem;
        padding: 10px 4px;
        text-align: center;
      }

      /* ── Buttons ──────────────────────────────────── */
      .btn {
        border: 0;
        border-radius: 999px;
        padding: 9px 16px;
        font-weight: 600;
        font-size: 0.85rem;
        cursor: pointer;
        color: white;
        white-space: nowrap;
      }
      .btn.primary  { background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
      .btn.secondary { background: #374151; }
      .btn.ghost {
        background: rgba(255,255,255,0.07);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 7px 14px;
      }
      .btn.ghost:hover { background: rgba(255,255,255,0.12); }
      .btn:disabled { opacity: 0.65; cursor: wait; }
      .btn.new-chat-btn {
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        width: 100%;
        border-radius: 12px;
        padding: 10px;
        flex-shrink: 0;
      }

      /* ── Chat area ────────────────────────────────── */
      .chat-card {
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
        padding: 16px;
        gap: 0;
      }
      .chat-top-bar {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        margin-bottom: 10px;
        flex-shrink: 0;
        min-height: 28px;
      }
      .chat-thread-label {
        font-size: 0.8rem;
        color: var(--muted);
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .messages {
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow-y: auto;
        overflow-x: hidden;
        background: rgba(255,255,255,0.02);
        border-radius: 12px;
        padding: 14px;
        flex: 1;
        min-height: 0;
        min-width: 0;
      }
      .messages::-webkit-scrollbar { width: 5px; }
      .messages::-webkit-scrollbar-track { background: transparent; }
      .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

      .message {
        padding: 12px 14px;
        border-radius: 14px;
        max-width: 88%;
        min-width: 0;
        width: fit-content;
        line-height: 1.6;
        font-size: 0.92rem;
        word-break: break-word;
        overflow-wrap: anywhere;
      }
      .message.user      { align-self: flex-end; background: linear-gradient(90deg, var(--accent), #7c3aed); }
      .message.assistant { align-self: flex-start; background: var(--panel-2); max-width: 92%; }
      .message.typing {
        opacity: 0.95;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: rgba(59,130,246,0.16);
      }
      .message.typing .dots { display: inline-flex; gap: 6px; }
      .message.typing .dot {
        width: 8px; height: 8px;
        border-radius: 999px; background: white;
        opacity: 0.35;
        animation: dotPulse 1s infinite ease-in-out;
      }
      .message.typing .dot:nth-child(1) { animation-delay: 0s; }
      .message.typing .dot:nth-child(2) { animation-delay: 0.15s; }
      .message.typing .dot:nth-child(3) { animation-delay: 0.3s; }
      @keyframes dotPulse {
        0%, 80%, 100% { opacity: 0.35; transform: translateY(0); }
        40%            { opacity: 1;    transform: translateY(-3px); }
      }

      pre {
        position: relative;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        padding: 14px;
        overflow-x: auto;
        margin: 10px 0;
      }
      pre code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        color: #f8fafc; line-height: 1.6; white-space: pre; display: block;
        font-size: 0.87rem;
      }
      code {
        background: rgba(255,255,255,0.08);
        border-radius: 6px; padding: 2px 6px;
        font-family: ui-monospace, monospace; font-size: 0.87em;
      }
      .copy-btn {
        position: absolute; top: 8px; right: 8px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1);
        color: var(--text); padding: 4px 8px;
        border-radius: 7px; font-size: 0.78rem; cursor: pointer;
      }
      .copy-btn:hover { background: rgba(255,255,255,0.12); }
      .meta-line { font-size: 0.75rem; color: var(--muted); margin-top: 6px; }

      /* ── Header upload ────────────────────────────── */
      .header-upload { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .header-upload input[type="file"] { display: none; }
      .upload-label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        background: rgba(255,255,255,0.07);
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 999px;
        cursor: pointer;
        font-size: 0.83rem;
        font-weight: 600;
        color: var(--text);
        white-space: nowrap;
        transition: background 0.15s;
      }
      .upload-label:hover { background: rgba(255,255,255,0.13); }
      .upload-submit {
        padding: 8px 18px;
        font-size: 0.83rem;
        border-radius: 999px;
      }
      .upload-submit:disabled { opacity: 0.55; cursor: default; }
      .upload-status {
        font-size: 0.78rem;
        display: none;
        max-width: 280px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .upload-status.success { color: var(--success); display: inline-block; }
      .upload-status.error   { color: var(--danger);  display: inline-block; }
      .upload-status.loading { color: var(--muted);   display: inline-block; }

      /* ── Indexed files pill list ──────────────────── */
      .indexed-files {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        padding: 6px 0 0;
        width: 100%;
      }
      .indexed-files-label {
        font-size: 0.75rem;
        color: var(--muted);
        white-space: nowrap;
      }
      .file-pill {
        font-size: 0.72rem;
        padding: 2px 10px;
        border-radius: 999px;
        background: rgba(139,92,246,0.18);
        border: 1px solid rgba(139,92,246,0.35);
        color: #c4b5fd;
        white-space: nowrap;
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ── Composer ─────────────────────────────────── */
      .composer {
        display: flex; gap: 10px; margin-top: 10px; flex-shrink: 0;
      }
      .composer input {
        flex: 1; border: 0; border-radius: 999px;
        padding: 12px 18px; background: #1f2937; color: white; font-size: 0.92rem;
        outline: none;
      }
      .composer input:focus { box-shadow: 0 0 0 2px rgba(139,92,246,0.45); }
      .composer button { min-width: 88px; }

      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="app">

      <!-- Header -->
      <div class="card header" style="flex-wrap:wrap; gap:12px;">
        <div>
          <h1>Sana AI Assistant</h1>
          <p>Intelligent Document Search</p>
        </div>

        <!-- Upload section in header -->
        <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;">
          <div class="header-upload">
            <label class="upload-label" for="fileInput">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
              Choose File
            </label>
            <input type="file" id="fileInput" accept=".pdf,.docx,.txt" multiple />
            <button class="btn primary upload-submit" id="uploadBtn" disabled>Index</button>
            <span class="upload-status" id="uploadStatus"></span>
            <button class="btn ghost" id="clearAllBtn">Clear Chats</button>
          </div>
        </div>
      </div>

      <!-- Main -->
      <div class="main">

        <!-- Sidebar -->
        <div class="sidebar">
          <div class="card sidebar-card">
            <div class="sidebar-header">
              <h2>Conversations</h2>
            </div>
            <button class="btn new-chat-btn" id="newChatBtn">+ New Chat</button>
            <div class="thread-list" id="threadList">
              <div class="sidebar-empty">No conversations yet.</div>
            </div>
          </div>
        </div>

        <!-- Chat -->
        <div class="card chat-card">
          <div class="chat-top-bar">
            <span class="chat-thread-label" id="chatThreadLabel"></span>
          </div>
          <div class="messages" id="messages"></div>
          <div class="composer">
            <input id="messageInput" placeholder="Ask anything…" autocomplete="off" />
            <button class="btn primary" id="sendBtn">Send</button>
          </div>
        </div>

      </div>
    </div>

    <script>
      // ── State ─────────────────────────────────────────────────────────────
      let sessionId = localStorage.getItem('sana-session-id');
      if (!sessionId) {
        sessionId = `session-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
        localStorage.setItem('sana-session-id', sessionId);
      }

      let activeThreadId = null;   // currently visible thread
      let threads = [];            // ordered array of thread summaries from server

      // ── DOM refs ──────────────────────────────────────────────────────────
      const messagesEl     = document.getElementById('messages');
      const inputEl        = document.getElementById('messageInput');
      const sendBtnEl      = document.getElementById('sendBtn');
      const threadListEl   = document.getElementById('threadList');
      const newChatBtnEl   = document.getElementById('newChatBtn');
      const clearAllBtnEl  = document.getElementById('clearAllBtn');
      const chatLabelEl    = document.getElementById('chatThreadLabel');
      const fileInputEl    = document.getElementById('fileInput');
      const uploadBtnEl    = document.getElementById('uploadBtn');
      const uploadStatusEl = document.getElementById('uploadStatus');

      // ── Helpers ───────────────────────────────────────────────────────────
      function escapeHtml(text) {
        return String(text || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function renderContent(content) {
        const raw = String(content || '');
        // Split on fenced code blocks first, preserving them
        const parts = raw.split(/(```[\w+-]*\n[\s\S]*?```)/g);
        return parts.map(part => {
          // Explicit fenced code block — render as <pre><code>
          const fenceMatch = part.match(/^```([\w+-]*)\n([\s\S]*?)```$/);
          if (fenceMatch) {
            return `<pre><code>${escapeHtml(fenceMatch[2])}</code></pre>`;
          }
          // Plain text — escape and render line breaks / inline code
          return escapeHtml(part)
            .replace(/`([^`\n]+)`/g, '<code>$1</code>')
            .replace(/\n{2,}/g, '<br><br>')
            .replace(/\n/g, '<br>');
        }).join('');
      }

      function addMessage(role, content) {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.innerHTML = `<div>${renderContent(content)}</div>`;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        // Attach copy buttons to any code blocks
        div.querySelectorAll('pre').forEach(pre => {
          if (pre.querySelector('.copy-btn')) return;
          const btn = document.createElement('button');
          btn.className = 'copy-btn';
          btn.textContent = 'Copy';
          btn.addEventListener('click', async () => {
            try {
              const code = pre.querySelector('code') ? pre.querySelector('code').innerText : pre.innerText;
              await navigator.clipboard.writeText(code);
              btn.textContent = 'Copied';
              setTimeout(() => (btn.textContent = 'Copy'), 2000);
            } catch {
              btn.textContent = 'Error';
              setTimeout(() => (btn.textContent = 'Copy'), 2000);
            }
          });
          pre.appendChild(btn);
        });
        return div;
      }

      function createTypingBubble() {
        const div = document.createElement('div');
        div.className = 'message assistant typing';
        div.innerHTML = '<div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
      }

      function setLoading(on) {
        sendBtnEl.disabled = on;
        inputEl.disabled   = on;
        sendBtnEl.textContent = on ? 'Thinking…' : 'Send';
      }

      function timeAgo(iso) {
        const diff = Date.now() - new Date(iso).getTime();
        const m = Math.floor(diff / 60000);
        if (m < 1) return 'just now';
        if (m < 60) return `${m}m ago`;
        const h = Math.floor(m / 60);
        if (h < 24) return `${h}h ago`;
        return new Date(iso).toLocaleDateString();
      }

      // ── Sidebar rendering ─────────────────────────────────────────────────
      function renderSidebar(threadArr, currentActiveId) {
        threadListEl.innerHTML = '';
        if (!threadArr || threadArr.length === 0) {
          threadListEl.innerHTML = '<div class="sidebar-empty">No conversations yet.</div>';
          return;
        }
        threadArr.forEach(t => {
          const div = document.createElement('div');
          div.className = 'thread-item' + (t.id === currentActiveId ? ' active' : '');
          div.dataset.threadId = t.id;

          // Preview = last assistant message snippet
          const lastAssistant = [...(t.messages || [])].reverse().find(m => m.role === 'assistant');
          const preview = lastAssistant
            ? lastAssistant.content.split('\n')[0].slice(0, 80) + (lastAssistant.content.length > 80 ? '…' : '')
            : '';

          div.innerHTML = `
            <div class="thread-body">
              <div class="thread-title">${escapeHtml(t.title || 'New conversation')}</div>
              <div class="thread-meta">${timeAgo(t.updatedAt)} · ${escapeHtml(t.source || 'general')}</div>
              ${preview ? `<div class="thread-preview">${escapeHtml(preview)}</div>` : ''}
            </div>
            <button class="thread-delete" title="Delete" data-thread-id="${t.id}">✕</button>
          `;

          // Click body → switch to thread
          div.querySelector('.thread-body').addEventListener('click', () => switchToThread(t.id));

          // Click delete button
          div.querySelector('.thread-delete').addEventListener('click', (e) => {
            e.stopPropagation();
            deleteThread(t.id);
          });

          threadListEl.appendChild(div);
        });
      }

      // ── API calls ─────────────────────────────────────────────────────────
      async function loadHistory() {
        try {
          const res = await fetch(`/api/history?sessionId=${sessionId}`);
          if (!res.ok) return;
          const data = await res.json();
          threads = data.threads || [];
          activeThreadId = data.activeThreadId || null;
          renderSidebar(threads, activeThreadId);
          // Update label
          const active = threads.find(t => t.id === activeThreadId);
          chatLabelEl.textContent = active ? active.title || 'Conversation' : '';
        } catch (e) {
          console.error('loadHistory error', e);
        }
      }

      async function switchToThread(threadId) {
        try {
          const res = await fetch('/api/switch-thread', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId, threadId })
          });
          if (!res.ok) return;
          const data = await res.json();
          activeThreadId = threadId;
          const thread = data.thread;

          // Re-render messages
          messagesEl.innerHTML = '';
          (thread.messages || []).forEach(m => addMessage(m.role, m.content));
          chatLabelEl.textContent = thread.title || 'Conversation';

          // Update sidebar highlight
          renderSidebar(threads, activeThreadId);
        } catch (e) {
          console.error('switchToThread error', e);
        }
      }

      async function startNewChat() {
        try {
          await fetch('/api/new-chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId })
          });
          activeThreadId = null;
          messagesEl.innerHTML = '';
          chatLabelEl.textContent = '';
          renderSidebar(threads, null);
          addMessage('assistant', 'Hello! I am Sana AI Assistant — ask me anything or continue a previous conversation from the sidebar.');
          inputEl.focus();
        } catch (e) {
          console.error('startNewChat error', e);
        }
      }

      async function deleteThread(threadId) {
        try {
          await fetch(`/api/thread?sessionId=${sessionId}&threadId=${threadId}`, { method: 'DELETE' });
          threads = threads.filter(t => t.id !== threadId);
          if (activeThreadId === threadId) {
            activeThreadId = null;
            messagesEl.innerHTML = '';
            chatLabelEl.textContent = '';
            addMessage('assistant', 'Hello! I am Sana AI Assistant — ask me anything or continue a previous conversation from the sidebar.');
          }
          renderSidebar(threads, activeThreadId);
        } catch (e) {
          console.error('deleteThread error', e);
        }
      }

      async function clearAll() {
        if (!confirm('Delete all conversations? This cannot be undone.')) return;
        try {
          await fetch(`/api/history?sessionId=${sessionId}`, { method: 'DELETE' });
          threads = [];
          activeThreadId = null;
          messagesEl.innerHTML = '';
          chatLabelEl.textContent = '';
          renderSidebar([], null);
          addMessage('assistant', 'All conversations cleared. Start fresh by typing below!');
        } catch (e) {
          console.error('clearAll error', e);
        }
      }

      // ── Send message ──────────────────────────────────────────────────────
      async function sendMessage() {
        const text = inputEl.value.trim();
        if (!text) return;
        inputEl.value = '';

        addMessage('user', text);
        setLoading(true);
        const typingBubble = createTypingBubble();

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text, sessionId })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Chat failed');

          // Update sessionId if the server assigned a new one
          if (data.sessionId && data.sessionId !== sessionId) {
            sessionId = data.sessionId;
            localStorage.setItem('sana-session-id', sessionId);
          }

          // Update active thread state
          activeThreadId = data.threadId || activeThreadId;

          // Render the assistant reply
          typingBubble.className = 'message assistant';
          typingBubble.innerHTML = `<div>${renderContent(data.answer)}</div>`;
          typingBubble.querySelectorAll('pre').forEach(pre => {
            if (pre.querySelector('.copy-btn')) return;
            const btn = document.createElement('button');
            btn.className = 'copy-btn';
            btn.textContent = 'Copy';
            btn.addEventListener('click', async () => {
              try {
                await navigator.clipboard.writeText(pre.querySelector('code')?.innerText || pre.innerText);
                btn.textContent = 'Copied';
                setTimeout(() => (btn.textContent = 'Copy'), 2000);
              } catch { btn.textContent = 'Error'; setTimeout(() => (btn.textContent = 'Copy'), 2000); }
            });
            pre.appendChild(btn);
          });

          // Reload sidebar with updated thread list
          await loadHistory();
          messagesEl.scrollTop = messagesEl.scrollHeight;
        } catch (error) {
          typingBubble.className = 'message assistant';
          typingBubble.innerHTML = `<div>Error: ${escapeHtml(error.message)}</div>`;
        } finally {
          setLoading(false);
        }
      }

      // ── Upload ────────────────────────────────────────────────────────────
      function setUploadStatus(type, msg) {
        uploadStatusEl.className = `upload-status ${type}`;
        uploadStatusEl.textContent = msg;
      }

      fileInputEl.addEventListener('change', () => {
        const files = Array.from(fileInputEl.files);
        uploadBtnEl.disabled = files.length === 0;
        uploadStatusEl.className = 'upload-status';
        uploadStatusEl.textContent = '';
      });

      uploadBtnEl.addEventListener('click', async () => {
        const files = Array.from(fileInputEl.files);
        if (files.length === 0) return;

        uploadBtnEl.disabled = true;
        setUploadStatus('loading', `Indexing ${files.length} file(s)…`);

        const form = new FormData();
        files.forEach(f => form.append('files', f));

        try {
          const res = await fetch('/api/upload', { method: 'POST', body: form });
          const data = await res.json();

          if (!res.ok) {
            setUploadStatus('error', `Error: ${data.error || 'Upload failed.'}`);
            uploadBtnEl.disabled = false;
            return;
          }

          const successNames = data.results.filter(r => r.success).map(r => r.sourceName);
          const failNames    = data.results.filter(r => !r.success).map(r => r.sourceName);

          if (successNames.length) {
            setUploadStatus('success', `✓ Indexed: ${successNames.join(', ')}`);
            addMessage('assistant', `Document${successNames.length > 1 ? 's' : ''} indexed: **${successNames.join(', ')}**. You can now ask questions about ${successNames.length > 1 ? 'them' : 'it'}!`);
          }
          if (failNames.length) {
            setUploadStatus('error', `✗ Failed: ${failNames.join(', ')}`);
          }

          // Reset file input
          fileInputEl.value = '';
          uploadBtnEl.disabled = true;

        } catch (err) {
          setUploadStatus('error', `Error: ${err.message}`);
          uploadBtnEl.disabled = false;
        }
      });

      // ── Event listeners ───────────────────────────────────────────────────
      sendBtnEl.addEventListener('click', sendMessage);
      inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
      newChatBtnEl.addEventListener('click', startNewChat);
      clearAllBtnEl.addEventListener('click', clearAll);

      // ── Boot ──────────────────────────────────────────────────────────────
      (async () => {
        await loadHistory();
        // If there's an active thread, restore it; otherwise show welcome
        if (activeThreadId) {
          await switchToThread(activeThreadId);
        } else {
          addMessage('assistant', 'Welcome! I am Sana AI Assistant — ask me anything, or click "+ New Chat" to start fresh.');
        }
      })();
    </script>
  </body>
</html>
